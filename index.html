<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACADENCE — From Academic Information to Action</title>
  <meta name="description" content="ACADENCE: AI-powered academic workload intelligence platform. Converts scattered academic information into clear, actionable student decisions.">
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Top Global Bar & View Switcher -->
    <header class="global-top-header" role="banner">
      <div class="brand-meta-group">
        <span class="brand-badge">ACADENCE PLATFORM</span>
        <div class="system-status">
          <span class="status-dot"></span>
          <span>Institutional Feed: Connected & Active</span>
        </div>
      </div>

      <!-- View Switcher for Live Evaluation & Presentation -->
      <div class="view-mode-selector" role="group" aria-label="Interface Perspective Mode">
        <button class="view-switcher-btn active" data-mode="split" title="Side-by-side Faculty LMS and Student ACADENCE for live reactive demonstration">
          <svg class="icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          Split View (LMS + ACADENCE)
        </button>
        <button class="view-switcher-btn" data-mode="student" title="Full-screen Student Intelligence Platform">
          <svg class="icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Student View (ACADENCE)
        </button>
        <button class="view-switcher-btn" data-mode="faculty" title="Full-screen Virtual LMS Faculty Portal">
          <svg class="icon-sm" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          Faculty View (Virtual LMS)
        </button>
      </div>
    </header>

    <!-- Hackathon 9-Step Demo Walkthrough Bar -->
    <section id="demo-controller-container" aria-label="Demo Controller"></section>

    <!-- Main Dual Application Workspace -->
    <div id="app-main-layout" class="app-layout layout-split">
      <!-- SIDE A: VIRTUAL LMS / FACULTY PORTAL -->
      <section id="faculty-lms-container" class="pane-faculty" aria-label="Virtual LMS Faculty Portal"></section>

      <!-- SIDE B: ACADENCE / STUDENT INTELLIGENCE PLATFORM -->
      <section id="acadence-student-container" class="pane-student" aria-label="ACADENCE Student Intelligence Platform"></section>
    </div>
  </div>

  <!-- Bootstrapper Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
